<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COMFORT TECHNOLOGIES COTEC — Chargement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Lexend:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="/assets/css/chargement-comfort.css" />
</head>
<body>
  <div id="app-loader" class="app-loader" role="status" aria-label="Chargement du site">
    <div class="app-loader__stars"></div>
    <div class="app-loader__stage">
      <span class="app-loader__wave"></span>
      <span class="app-loader__wave"></span>
      <span class="app-loader__wave"></span>
      <div class="app-loader__orbit app-loader__orbit--outer">
        <span class="app-loader__sat"></span>
      </div>
      <div class="app-loader__orbit app-loader__orbit--inner">
        <span class="app-loader__sat"></span>
        <span class="app-loader__beam"></span>
      </div>
      <div class="app-loader__disc"></div>
    </div>
    <div class="app-loader__info">
      <p class="app-loader__brand">COMFORT TECHNOLOGIES COTEC</p>
      <p class="app-loader__status">Chargement…</p>
      <div class="app-loader__row">
        <div class="app-loader__bar"></div>
        <div class="app-loader__signal"><i></i><i></i><i></i><i></i></div>
      </div>
      <p class="app-loader__hint">Internet haut débit par satellite</p>
    </div>
  </div>
</body>
</html>
